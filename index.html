<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sgfcap — go diagram to SGF</title>

    <!--
      SVG first for anything that will take one, and a 32px raster behind it for Safari
      older than 16.4. Declaring both stops the browser probing /favicon.ico as well.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <meta
      name="description"
      content="Turn a diagram from a go book into an editable SGF. Nothing leaves your browser."
    />

    <!--
      Link previews, and the one place in this page that has to name where it is deployed.
      Everything else loads relatively (see `base` in vite.config.ts) so the build runs from
      any path, but a crawler resolves og:image against nothing and needs it absolute. If the
      site moves, these four URLs are what to change.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="sgfcap" />
    <meta
      property="og:description"
      content="Turn a diagram from a go book into an editable SGF. Nothing leaves your browser."
    />
    <meta property="og:url" content="https://fvictorio.github.io/sgfcap/" />
    <meta property="og:image" content="https://fvictorio.github.io/sgfcap/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A crosscut, beside the word sgfcap" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main>
      <header>
        <h1>sgfcap</h1>
        <p>Turn a diagram from a go book into an editable SGF. Nothing leaves your browser.</p>
      </header>

      <section id="intake">
        <label id="dropzone" for="file">
          <strong>Upload or paste an image</strong>
          <span>Drop a diagram here, click to choose a file, or press <kbd>Ctrl</kbd>+<kbd>V</kbd></span>
          <input id="file" type="file" accept="image/*" />
        </label>
      </section>

      <p id="status" role="status" hidden></p>

      <!--
        The invitation to write in is markup rather than something the script builds, so the
        address is declared once in each place it appears and there is no HTML being assembled
        out of strings. The script only ever sets #error-detail's text and shows or hides the
        offer, which does not apply to every failure — a clipboard permission is not a diagram
        worth sending anyone.
      -->
      <p id="error" role="alert" hidden>
        <span id="error-detail"></span>
        <span id="error-offer">
          If you think it should work, send it to
          <a href="mailto:sgfcapture@gmail.com?subject=A%20diagram%20that%20should%20work">sgfcapture@gmail.com</a>
          and I will take a look.
        </span>
      </p>

      <section id="result" hidden>
        <div id="board"></div>
        <aside>
          <h2>Source image</h2>
          <img id="source" alt="The diagram this board was read from" />
          <div class="actions">
            <button id="copy" type="button">Copy SGF</button>
            <button id="reset" type="button">Use another image</button>
          </div>
        </aside>
      </section>
    </main>

    <footer>
      <a href="mailto:sgfcapture@gmail.com?subject=sgfcap">Contact</a>
    </footer>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
